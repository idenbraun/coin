<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EBF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13131F" media="(prefers-color-scheme: dark)">
<meta name="description" content="Когда нужно принять трудное решение, подбрось монетку. Пока она в воздухе, ты поймёшь, чего на самом деле хочешь.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Монетка">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<title>Монетка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: один экран. Название и мысль сверху, монета в центре (она же кнопка), тихая строка статистики внизу. */
:root {
  --bg: #E8EBF4;
  --ink: #1B1E33;
  --muted: #565B7A;
  --line: #CBD0E3;
  --focus: #3B3FD9;
  --coin-hi: #FFE394;
  --coin-mid: #E5A92F;
  --coin-lo: #A56A12;
  --coin-ink: #5A3A06;
  --edge-a: #B97A16;
  --edge-b: #8F5A0C;
  --font-display: 'Unbounded', 'Arial Black', 'Helvetica Neue', sans-serif;
  --font-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --d: min(60vw, 230px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13131F; --ink: #ECEEFA; --muted: #9A9FC2; --line: #2E3050; --focus: #9AA0FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13131F; --ink: #ECEEFA; --muted: #9A9FC2; --line: #2E3050; --focus: #9AA0FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
.app {
  max-width: 480px;
  min-height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
header { text-align: center; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(30px, 9vw, 40px);
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  border: 0;
  border-radius: 12px;
  background: none;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.title:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.chev {
  display: inline-flex;
  color: var(--muted);
  opacity: .65;
  transition: transform .3s ease, opacity .2s ease;
}
.chev svg { width: .5em; height: .5em; min-width: 16px; min-height: 16px; display: block; }
.title:hover .chev { opacity: 1; }
.chev.nudge svg { animation: nudge 1.3s ease-in-out 1.8s 2; }
.title[aria-expanded="true"] .chev { transform: rotate(180deg); }
@keyframes nudge {
  0%, 60%, 100% { transform: translateY(0); }
  25% { transform: translateY(4px); }
  45% { transform: translateY(1px); }
  80% { transform: translateY(3px); }
}
.about {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .3s ease;
}
.about.open { grid-template-rows: 1fr; }
.about-in { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s .3s; }
.about.open .about-in { visibility: visible; transition-delay: 0s; }
.sub {
  margin: 10px auto 0;
  max-width: 38ch;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.5;
  text-wrap: pretty;
}

/* Сцена с монетой */
.stage {
  position: relative;
  width: 100%;
  height: calc(var(--d) + 190px);
  flex: none;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding-bottom: 34px;
  perspective: 900px;
}
.shadow {
  position: absolute;
  bottom: 14px;
  left: 50%;
  width: calc(var(--d) * 0.8);
  height: 20px;
  margin-left: calc(var(--d) * -0.4);
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,.38), rgba(0,0,0,0) 70%);
}
.lift { transform-style: preserve-3d; animation: idle 3.4s ease-in-out infinite; }
.lift.busy { animation: none; }
@keyframes idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.coin {
  position: relative;
  width: var(--d);
  height: var(--d);
  transform-style: preserve-3d;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  border-radius: 50%;
}
.coin:focus-visible { outline: 3px solid var(--focus); outline-offset: 10px; }
.face, .edge { position: absolute; inset: 0; border-radius: 50%; }
.edge:nth-child(odd) { background: var(--edge-a); }
.edge:nth-child(even) { background: var(--edge-b); }
.face {
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 34% 28%, var(--coin-hi), var(--coin-mid) 58%, var(--coin-lo) 125%);
  box-shadow: inset 0 0 0 3px rgba(90,58,6,.35);
}
.face::before {
  content: "";
  position: absolute;
  inset: 11px;
  border-radius: 50%;
  border: 2px solid rgba(90,58,6,.4);
}
.face.front { transform: translateZ(8px); }
.face.back { transform: rotateX(180deg) translateZ(8px); }
.face span {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: calc(var(--d) * 0.26);
  text-transform: uppercase;
  color: var(--coin-ink);
  text-shadow: 0 1px 0 rgba(255,238,180,.65);
  line-height: 1.1;
}

/* Статистика: свёрнута, раскрывается вверх по клику */
.foot { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stat-toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  border: 0;
  border-radius: 10px;
  background: none;
  color: var(--muted);
  font: 400 13px var(--font-body);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.stat-toggle:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.stat-toggle .chev svg { width: 14px; height: 14px; min-width: 0; min-height: 0; }
.stat-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.stat-toggle:hover .chev { opacity: 1; }
.panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: min(100%, 340px);
  margin: 4px 0 6px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  font-variant-numeric: tabular-nums;
}
.panel-head { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }
.bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; width: 0; transition: width .5s ease; }
.bar .by { background: var(--coin-mid); }
.bar .bn { background: var(--ink); }
.panel-row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.panel-row > div { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.panel-row b { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.panel-row small { color: var(--muted); font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; align-self: center; flex: none; }
.dot.y { background: var(--coin-mid); }
.dot.n { background: var(--ink); }
.panel .reset { align-self: center; }
.reset {
  padding: 2px 0;
  border: 0;
  background: none;
  color: var(--muted);
  font: 400 13px var(--font-body);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.reset:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (prefers-reduced-motion: reduce) {
  .lift { animation: none; }
  .chev.nudge svg { animation: none; }
  .about, .chev, .bar i { transition: none; }
}
</style>

</head>
<body>
<main class="app">
  <header>
    <h1>
      <button type="button" class="title" id="titleBtn" aria-expanded="false" aria-controls="about" title="Что это за монетка">
        Монетка
        <span class="chev nudge" id="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
    </h1>
    <div class="about" id="about">
      <div class="about-in">
        <p class="sub">Когда нужно принять трудное решение, подбрось монетку. В тот момент, когда монета в воздухе, ты внезапно понимаешь, чего на самом деле хочешь. Если результат тебя разочарует, поступи наоборот.</p>
      </div>
    </div>
  </header>

  <div class="stage">
    <div class="shadow" id="shadow"></div>
    <div class="lift" id="lift">
      <div class="coin" id="coin" role="button" tabindex="0" aria-label="Бросить монетку">
        <div class="face front"><span>Да</span></div>
        <div class="face back"><span>Нет</span></div>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="about" id="statPanelWrap">
      <div class="about-in">
        <div class="panel" id="statPanel">
          <p class="panel-head" id="statHead">Пока ни одного броска</p>
          <div class="bar" aria-hidden="true"><i class="by" id="barYes"></i><i class="bn" id="barNo"></i></div>
          <div class="panel-row">
            <div><span class="dot y"></span>Да <b id="cYes">0</b> <small id="pYes"></small></div>
            <div><span class="dot n"></span>Нет <b id="cNo">0</b> <small id="pNo"></small></div>
          </div>
          <button type="button" class="reset" id="reset" hidden>сбросить статистику</button>
        </div>
      </div>
    </div>
    <button type="button" class="stat-toggle" id="statBtn" aria-expanded="false" aria-controls="statPanelWrap">
      <span>Статистика<span id="statTotal"></span></span>
      <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></span>
    </button>
  </div>

  <p class="sr-only" id="live" aria-live="polite"></p>
</main>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var coin = $('#coin'), lift = $('#lift'), shadow = $('#shadow');
  var cYes = $('#cYes'), cNo = $('#cNo'), pYes = $('#pYes'), pNo = $('#pNo');
  var barYes = $('#barYes'), barNo = $('#barNo'), statHead = $('#statHead'), statTotal = $('#statTotal');
  var statBtn = $('#statBtn'), statWrap = $('#statPanelWrap');
  var resetBtn = $('#reset'), live = $('#live');

  statBtn.addEventListener('click', function () {
    var open = statWrap.classList.toggle('open');
    statBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  var titleBtn = $('#titleBtn'), about = $('#about'), chev = $('#chev');
  var hintSeen = false;
  try { hintSeen = localStorage.getItem('coin-hint') === '1'; } catch (err) {}
  if (hintSeen) chev.classList.remove('nudge');
  titleBtn.addEventListener('click', function () {
    var open = about.classList.toggle('open');
    titleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    chev.classList.remove('nudge');
    try { localStorage.setItem('coin-hint', '1'); } catch (err) {}
  });

  var THICK = 16;
  var EDGES = 9;
  for (var i = 0; i < EDGES; i++) {
    var e = document.createElement('div');
    e.className = 'edge';
    var z = -(THICK / 2 - 1) + i * ((THICK - 2) / (EDGES - 1));
    e.style.transform = 'translateZ(' + z.toFixed(2) + 'px)';
    coin.insertBefore(e, coin.firstChild);
  }

  var LABELS = ['Да', 'Нет'];
  var counts = [0, 0];
  var angle = 0;
  var busy = false;

  try {
    var saved = JSON.parse(localStorage.getItem('coin-stats') || 'null');
    if (Array.isArray(saved) && saved.length === 2) {
      counts = [Math.max(0, parseInt(saved[0], 10) || 0), Math.max(0, parseInt(saved[1], 10) || 0)];
    }
  } catch (err) {}

  function saveCounts() {
    try { localStorage.setItem('coin-stats', JSON.stringify(counts)); } catch (err) {}
  }

  function paintStats() {
    var total = counts[0] + counts[1];
    cYes.textContent = counts[0];
    cNo.textContent = counts[1];
    statTotal.textContent = total ? ' · ' + total : '';
    if (total === 0) {
      statHead.textContent = 'Пока ни одного броска';
      pYes.textContent = '';
      pNo.textContent = '';
      barYes.style.width = '0%';
      barNo.style.width = '0%';
      resetBtn.hidden = true;
      return;
    }
    var py = Math.round(counts[0] / total * 100);
    statHead.textContent = 'Всего бросков: ' + total;
    pYes.textContent = py + '%';
    pNo.textContent = (100 - py) + '%';
    barYes.style.width = (counts[0] / total * 100) + '%';
    barNo.style.width = (counts[1] / total * 100) + '%';
    resetBtn.hidden = false;
  }

  function pickSide() {
    var a = new Uint32Array(1);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return a[0] & 1;
  }

  function reduced() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function flip() {
    if (busy) return;
    busy = true;
    lift.classList.add('busy');
    live.textContent = '';

    var side = pickSide();
    var short = reduced();
    var spins = short ? 1 : 5 + Math.floor(Math.random() * 3);
    var desired = side * 180;
    var delta = (desired - (((angle % 360) + 360) % 360) + 360) % 360;
    var target = angle + spins * 360 + delta;
    var dur = short ? 500 : 1900;

    var coinAnim = coin.animate(
      [{ transform: 'rotateX(' + angle + 'deg)' }, { transform: 'rotateX(' + target + 'deg)' }],
      { duration: dur, easing: 'cubic-bezier(.3,.5,.4,1)', fill: 'forwards' }
    );
    var anims = [coinAnim];

    if (!short) {
      anims.push(lift.animate([
        { transform: 'translateY(0) scale(1)', easing: 'cubic-bezier(.2,.7,.4,1)' },
        { transform: 'translateY(-170px) scale(1.12)', offset: 0.45, easing: 'cubic-bezier(.6,0,.9,.4)' },
        { transform: 'translateY(0) scale(1)' }
      ], { duration: dur }));
      anims.push(shadow.animate([
        { transform: 'scale(1)', opacity: 1, easing: 'cubic-bezier(.2,.7,.4,1)' },
        { transform: 'scale(.5)', opacity: .4, offset: 0.45, easing: 'cubic-bezier(.6,0,.9,.4)' },
        { transform: 'scale(1)', opacity: 1 }
      ], { duration: dur }));
    }

    Promise.all(anims.map(function (a) { return a.finished; })).catch(function () {}).then(function () {
      angle = target;
      coin.style.transform = 'rotateX(' + angle + 'deg)';
      coinAnim.cancel();

      var bounce = null;
      if (!short) {
        bounce = lift.animate([
          { transform: 'translateY(0)' },
          { transform: 'translateY(-16px)' },
          { transform: 'translateY(0)' }
        ], { duration: 320, easing: 'ease-out' });
      }

      counts[side] += 1;
      saveCounts();
      paintStats();
      live.textContent = 'Выпало: ' + LABELS[side];

      var done = function () { busy = false; lift.classList.remove('busy'); };
      if (bounce) { bounce.finished.then(done, done); } else { done(); }
    });
  }

  coin.addEventListener('click', flip);
  coin.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); flip(); }
  });
  document.addEventListener('keydown', function (ev) {
    if ((ev.key === ' ' || ev.code === 'Space') && ev.target === document.body) {
      ev.preventDefault();
      flip();
    }
  });
  resetBtn.addEventListener('click', function () {
    if (busy) return;
    counts = [0, 0];
    saveCounts();
    paintStats();
  });

  paintStats();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
